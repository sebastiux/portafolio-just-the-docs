# Autoevaluación de los brazos robóticos contra la rúbrica resumida del curso
# (https://hubergiron.github.io/Integracion-mecatronica/evaluacion-resumida.html).
#
# Estados por brazo:
#   cumple  · la evidencia existe, es verificable y corresponde con el brazo físico
#   parcial · hay una parte de la evidencia; falta lo que dice "falta"
#   falta   · no hay evidencia todavía
#   na      · el criterio no aplica a ese brazo (solo B16 en el brazo impreso)
#
# El criterio cuenta para el proyecto solo cuando los dos brazos cumplen
# (o uno cumple y el otro es "na"). Al subir evidencia, cambiar aquí el
# estado y el texto de "falta"; la página recalcula los puntos.

secciones:
  - titulo: "1. Concepto y definición"
    criterios:
      - id: B01
        titulo: Problema, objetivos y requisitos
        peso: 3
        impreso: parcial
        laser: parcial
        evidencia: /brazos/#1-problema-objetivos-y-requisitos-b01
        falta: Contrastar los requisitos con el enunciado oficial del proyecto.
      - id: B02
        titulo: Bocetos de la solución
        peso: 3
        impreso: falta
        laser: falta
        evidencia: /brazos/#2-bocetos-de-la-solución-b02
        falta: Fotos o escaneos de los bocetos a mano de los dos brazos.
      - id: B03
        titulo: Alternativas y selección
        peso: 3
        impreso: parcial
        laser: parcial
        evidencia: /brazos/#3-alternativas-y-selección-b03
        falta: Las alternativas que el equipo consideró y por qué se descartaron. La justificación de los diseños elegidos ya está.
      - id: B04
        titulo: Arquitectura general
        peso: 3
        impreso: cumple
        laser: cumple
        evidencia: /brazos/#4-arquitectura-general-b04
        falta: ""

